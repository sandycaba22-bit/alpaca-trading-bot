<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Bot Alpaca</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <main class="card">
        <p class="eyebrow">Alpaca Paper</p>
        <h1>Panel del bot</h1>
        <p class="muted">Acceso restringido al administrador.</p>
        <p id="error" class="error hidden">Credenciales incorrectas o demasiados intentos.</p>
        <form method="post" action="/api/login" autocomplete="off">
            <label for="username">Usuario</label>
            <input id="username" name="username" type="text" required maxlength="64" autofocus>
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" required maxlength="128">
            <button type="submit">Entrar</button>
        </form>
    </main>
    <script>
        const params = new URLSearchParams(window.location.search);
        if (params.get('error')) {
            document.getElementById('error').classList.remove('hidden');
        }
    </script>
</body>
</html>
